[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astabench"
version = "0.5.4"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # SOLVE ARM inspect_ai floor. This is deliberately the shared floor that
    # agent-baselines' inspect-swe declares (`inspect_ai>=0.3.249`), so the two
    # cohere instead of fighting. The current Claude Code and Codex inspect_swe
    # agents need >=0.3.249 for (a) the Anthropic sandbox bridge to accept a
    # system-role message in `messages[]` (folded into ChatMessageSystem in
    # messages_from_anthropic_input; older raised "Unexpected message role:
    # system") and (b) the newer `checkpointer` bridge API that inspect_swe
    # >=0.2.65 passes. Both earlier fixes this pin carried are still present at
    # >=0.3.249: bridged MCP result serialization (0.3.220) and inline
    # Anthropic system-role messages (0.3.233).
    #
    # Was ==0.3.233, which sat BELOW agent-baselines' >=0.3.249 floor. When the
    # eval overlays this package (`uv run --project solvers/inspect-swe --with
    # asta-bench-private`), the hard `==` pin won over agent-baselines'
    # override-dependencies and pulled the solve env down to 0.3.233, so
    # inspect_swe's newer `checkpointer` call crashed with
    # `sandbox_agent_bridge() got an unexpected keyword argument 'checkpointer'`.
    # Relaxing this to the shared floor is the fix.
    #
    # NOTE: >=0.3.249's Anthropic provider requires anthropic>=0.105 (see the
    # anthropic floor below); the agent-baselines lock carries that via #32.
    # The SCORER's inspect_ai pin (solvers/scorer/pyproject.toml, 0.3.225) is
    # intentionally NOT bumped here — raising it risks changing scoring logic
    # and is done only reactively when a solve-arm event type can't be read.
    # See gas2own#346, gas2own#430, allenai/agent-baselines#31 and #32.
    "inspect_ai>=0.3.249",
    # Base agent-eval is the inspect-free solve contract (suite config,
    # EvalConfig, and git reproducibility helpers). Scoring dependencies,
    # including inspect_ai==0.3.203, live in agent-eval's scoring/leaderboard
    # extras and are installed only by solvers/scorer. See gas2own#346.
    "agent-eval==0.1.53",
    "openai>=2.30.0", # provider SDK version validated with the current model set
    "pydantic>=2.11.4", # required by inspect
    "pyyaml", # scripts/task_metadatas.py parses suite .yml files directly
    "litellm==1.88.1",
    "datasets~=3.2.0",
    "huggingface_hub",
    "google-genai>=1.70.0",
    "nltk",
    "tabulate",
    "click==8.1.8",
    "nora_lib-impl~=1.1.0",
    "mcp~=1.10",
    "httpx~=0.28.1",
    "httpx-sse>=0.4.2", # need at least 0.4.2 for a key SSE decoding fix
    "h2~=4.2.0",
    "pandas",
    "scipy",
    # NB: inspect_ai>=0.3.249's Anthropic provider requires anthropic>=0.105 at
    # runtime. This floor permits it (the resolver picks a recent anthropic),
    # and the frozen solve-env lock carries it explicitly via
    # allenai/agent-baselines#32; not pinned tighter here to avoid churning the
    # scorer env, which shares this dependency.
    "anthropic>=0.87.0",
    "platformdirs",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "black==24.2.0",
    "isort",
    "autoflake",
    "pytest",
    "pytest-asyncio",
    "flake8==7.2.0",
    "flake8-pyproject==1.2.3",
    "mypy==1.15",
    "pandas-stubs",
]
azure = [
    "azure-ai-inference"
]

[project.scripts]
astabench = "astabench.cli:cli"
inspect = "inspect_ai._cli.main:main"

[project.entry-points.inspect_ai]
astabench = "astabench.evals._registry"

[tool.setuptools.packages.find]
where = [".", "inspect_evals/src"]
include = ["astabench*", "inspect_evals", "inspect_evals.core_bench", "inspect_evals.ds1000"]

[tool.uv]
conflicts = [
    [{extra = "sqa"}, {extra = "storm"}],
    [{extra = "sqa"}, {extra = "futurehouse"}],
    [{extra = "storm"}, {extra = "smolagents"}],
]

[tool.flake8]
select = [
    # F category for logical errors
    "F",

    # Serious "E" errors
    "E721", # `type(x) == <t>` instead of `isinstance(x, <t>)`
    "E901", "E902", "E999" # syntax errors
]

ignore = [
    "F401",  # module imported but unused
    "F541",  # f-string is missing placeholders
]

[tool.pylint.messages_control]
disable = [
    "line-too-long",                 # C0301 - handled by black
    "too-many-instance-attributes",  # R0902 - design choice
    "too-many-arguments",            # R0913 - design choice
    "too-many-locals",               # R0914 - design choice
    "too-many-branches",             # R0912 - design choice
    "too-many-statements",           # R0915 - design choice
    "too-few-public-methods",        # R0903 - design choice
    "no-else-return",                # R1705 - style preference
    "no-else-raise",                 # R1720 - style preference
]

[tool.setuptools.package-data]
"astabench" = ["config/*.yml", "evals/inspect_eval_wrappers/ds1000_splits.json", "util/sandbox/sandbox_compose.yaml", "util/sandbox/Dockerfile", "util/sandbox/*.txt", "evals/demo/code_execution/*.yaml", "evals/demo/arithmetic/data.json"]
"inspect_evals.core_bench" = [
    "*.json",
    "*.yaml",
    "Dockerfile",
    "*.md",
]

[tool.uv.sources]
knowledge-storm = { git = "https://github.com/gituser768/storm", branch = "dh-fix-youcom" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# give each async test its own loop
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
# default to skipping expensive tests
addopts = "-m \"not expensive\""
markers = [
  "expensive: mark test as expensive (skipped by default)",
  "asta_tool_api_request: mark test as requiring Asta tool key (auto-skipped when ASTA_TOOL_KEY not set)"
]
