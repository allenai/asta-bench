[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astabench-scorer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "astabench",
    # Add agent-eval's scorer / leaderboard stack only in this isolated env.
    # Base astabench uses agent-eval's inspect-free contract; this extra adds the
    # frozen scoring Inspect version through the override below (gas2own#346).
    "agent-eval[leaderboard]==0.1.54",
    # Scorer Inspect must be >= every event type the solve arms can emit, or
    # read_eval_log rejects the log. It was 0.3.203, but interrupted samples
    # write an InterruptEvent (added in Inspect 0.3.225), which a 0.3.203 reader
    # cannot deserialize (gas2own#346, job v6). Per maintainer guidance we take
    # the minimal reactive bump: raise only as far as an observed new event type
    # requires — 0.3.225 for InterruptEvent — not preemptively to the solve pin.
    "inspect_ai==0.3.225",
]

[tool.uv.sources]
# Use local astabench code from this repository.
astabench = { path = "../..", editable = true }

[tool.uv]
# Override needed so the local astabench editable dependency resolves to the scorer pin.
override-dependencies = [
    "inspect_ai==0.3.225",
]
