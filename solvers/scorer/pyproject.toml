[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astabench-scorer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "astabench",
    # Add agent-eval's scorer / leaderboard stack only in this isolated env.
    # Base astabench uses agent-eval's inspect-free contract; this extra adds the
    # frozen scoring Inspect version through the override below (gas2own#346).
    "agent-eval[leaderboard]==0.1.52",
    # Override astabench's base inspect pin back down to what agent-eval requires,
    # so scoring and registry loading use the same Inspect. See override below.
    "inspect_ai==0.3.203",
]

[tool.uv.sources]
# Use local astabench code from this repository.
astabench = { path = "../..", editable = true }
# Temporary stacked-PR source. Remove after agent-eval 0.1.52 is published.
agent-eval = { git = "https://github.com/allenai/agent-eval.git", rev = "5389fbedc02fab638d9da8e4822e11f3e500b437" }

[tool.uv]
# Override needed so the local astabench editable dependency resolves to the scorer pin.
override-dependencies = [
    "inspect_ai==0.3.203",
]
